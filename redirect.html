<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redirecting...</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
    }

    #countdown {
      margin-top: 20px;
      font-size: 1.2rem;
    }

    .hidden {
      display: none;
    }

    button {
      margin-top: 20px;
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>

  <h1>Hold on! Redirecting you...</h1>

  <p id="countdown">Redirecting in <span id="timer">5</span> seconds...</p>

  <button id="continueBtn" class="hidden" onclick="redirectNow()">Continue</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");

    if (!url) {
      document.body.innerHTML = "<h2 style='color:red;'>Error: No URL provided!</h2>";
    } else {
      let seconds = 5;
      const timer = document.getElementById("timer");
      const continueBtn = document.getElementById("continueBtn");

      const countdown = setInterval(() => {
        seconds--;
        timer.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(countdown);
          document.getElementById("countdown").textContent = "Ready!";
          continueBtn.classList.remove("hidden");
        }
      }, 1000);

      function redirectNow() {
        window.location.href = url;
      }
    }
  </script>

</body>
</html>
