<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Redirecting...</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
    }

    .ad-box {
      border: 2px dashed #999;
      padding: 30px;
      margin: 30px 0;
      background-color: #f9f9f9;
      position: relative;
    }

    .ad-banner {
      background-color: #fff8e1;
      border: 1px solid #ffc107;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #8a6d00;
      animation: pulse 1.5s infinite;
    }

    .ad-banner a {
      color: #007bff;
      text-decoration: underline;
    }

    #continue-btn {
      display: none;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    #continue-btn:hover {
      background-color: #0056b3;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>

  <p id="countdown">Redirecting in <span id="timer">5</span> seconds...</p>
  <!-- <button id="continueBtn" style="display: none;" onclick="redirectNow()">Continue</button> -->
  
  <button id="continueBtn" class="mt-4 bg-green-500 text-white p-2 rounded-lg hidden" onclick="redirectNow()">Continue</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
  
    if (!url) {
      document.body.innerHTML = "<h2>Error: No URL provided!</h2>";
    } else {
      let seconds = 5;
      const timer = document.getElementById("timer");
      const continueBtn = document.getElementById("continueBtn");
  
      const countdown = setInterval(() => {
        seconds--;
        timer.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(countdown);
          document.getElementById("countdown").textContent = "Ready!";
        //   continueBtn.style.display = "inline-block";
        continueBtn.classList.remove("hidden");

        }
      }, 1000);
  
      function redirectNow() {
        window.location.href = url;
      }
    }
  </script>
  
</body>
