<!DOCTYPE html>
<html lang="en">

<head>

    <!-- favicon -->
    <link rel="icon" href="assets/fevicon.png" type="image/png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 🔥 SEO Title and Description -->
    <title>Free QR Code Generator | Create & Download QR Codes Instantly</title>
    <meta name="description" content="Generate free QR codes instantly! Fast, easy, and free QR Code generator for websites, text, business cards, restaurants, and more. No sign-up needed.">
  
    <!-- ✅ Open Graph Tags (for better link previews when shared on WhatsApp, LinkedIn, Twitter) -->
    <meta property="og:title" content="Free QR Code Generator" />
    <meta property="og:description" content="Create QR codes easily and download them in seconds. 100% free and fast!" />
    <meta property="og:image" content="https://arshhasan.github.io/qr-code-generator/thumbnail.png" />
    <meta property="og:url" content="https://arshhasan.github.io/qr-code-generator/" />
    <meta property="og:type" content="website" />
  
    <!-- ✅ Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free QR Code Generator" />
    <meta name="twitter:description" content="Create QR codes online — free, easy, and fast!" />
    <meta name="twitter:image" content="https://arshhasan.github.io/qr-code-generator/thumbnail.png" />
  
    <!-- ✅ Favicon (Optional but recommended) -->
    <link rel="icon" href="https://arshhasan.github.io/qr-code-generator/favicon.ico" type="image/x-icon" />
  
    <!-- TailwindCSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  </head>
  
<body class="bg-gray-50">
  <div class="max-w-md mx-auto p-6 bg-white shadow-lg rounded-lg mt-20">
    <h2 class="text-3xl font-bold text-center mb-6">QR Code Generator</h2>

    <input
      type="text"
      id="text"
      placeholder="Enter URL or text"
      class="w-full p-2 border rounded-lg mb-4"
    />
    <button
      onclick="generateQR()"
      class="w-full bg-blue-500 text-white p-2 rounded-lg"
    >
      Generate QR Code
    </button>

    <div id="qrcode" class="mt-6 flex justify-center"></div>

    <!-- 🔽 Download Link -->
    <div class="mt-4 text-center">
      <a
        id="downloadLink"
        href="#"
        class="hidden text-blue-600 underline"
        download="qrcode.png"
      >Download QR Code</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    function generateQR() {
      const rawInput = document.getElementById("text").value.trim();
      const qrContainer = document.getElementById("qrcode");
      const downloadLink = document.getElementById("downloadLink");

      qrContainer.innerHTML = ""; // Clear previous QR
      downloadLink.classList.add("hidden"); // Hide download link initially

      if (rawInput === "") {
        alert("Please enter something.");
        return;
      }

      // Auto-fix URL if needed
      let destinationUrl = rawInput;
      if (!destinationUrl.startsWith("http://") && !destinationUrl.startsWith("https://")) {
        if (destinationUrl.includes(".") && !destinationUrl.includes(" ")) {
          destinationUrl = "https://" + destinationUrl;
        }
      }

      // IMPORTANT: Put your correct domain/path
    //   const redirectUrl = `redirect.html?url=${encodeURIComponent(destinationUrl)}`;
    const redirectUrl = `https://arshhasan.github.io/qr-code-generator/redirect.html?url=${encodeURIComponent(destinationUrl)}`;


      new QRCode(qrContainer, {
        text: redirectUrl,
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.H,
      });

      setTimeout(() => {
        const qrImage = qrContainer.querySelector("img");
        if (qrImage) {
          downloadLink.href = qrImage.src;
          downloadLink.classList.remove("hidden");
        }
      }, 100);
    }
  </script>
</body>
</html>
